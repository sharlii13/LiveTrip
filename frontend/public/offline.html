<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e7490" />
  <title>LiveTrip - You're offline</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
           box-sizing: border-box; text-align: center; background: #fff; color: #0f172a;
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 26rem; }
    img { width: 96px; height: 96px; }
    h1 { font-size: 1.75rem; margin: 20px 0 8px; }
    p { color: #475569; line-height: 1.5; margin: 0 0 24px; }
    button { font: inherit; font-weight: 600; color: #fff; background: #0e7490; border: 0; border-radius: 999px;
             padding: 12px 28px; cursor: pointer; }
    button:hover { background: #155e75; }
    @media (prefers-color-scheme: dark) { body { background: #000; color: #e2e8f0; } p { color: #94a3b8; } }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>LiveTrip needs a connection for live places, maps and weather. Your trips are safe; reconnect and they'll be right here.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
